<!DOCTYPE html>

<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/icon" type="image/png">
    <link rel="stylesheet" href="style.css">
    <title>Secret gevonden! | SJB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">


<style>
    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .secret-card {
        width: min(700px, 100%);
        text-align: center;
        padding: 60px 40px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .secret-logo {
        width: 90px;
        height: 90px;
        margin: 0 auto 30px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .secret-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .secret-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #39ff7e;
    }

    .secret-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #39ff7e;
    }

    .secret-card h1 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(40px, 7vw, 70px);
        line-height: 1;
        letter-spacing: -0.04em;
    }

    .secret-card h1 span {
        color: #39ff7e;
    }

    .secret-card p {
        max-width: 560px;
        margin: 25px auto 35px;
        font-family: "DM Sans", sans-serif;
        font-size: 18px;
        line-height: 1.6;
        opacity: 0.7;
    }

    .home-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 24px;
        border-radius: 12px;
        background: #39ff7e;
        color: #000;
        font-family: "DM Sans", sans-serif;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .home-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(57, 255, 126, 0.2);
    }

    @media (max-width: 600px) {
        .secret-card {
            padding: 45px 25px;
        }

        .secret-card p {
            font-size: 16px;
        }
    }
</style>
```

</head>

<body>

            <span class="secret-dot"></span>

        </div>

        <h1>
            Je hebt de<br>
            <span>secret gevonden!</span>
        </h1>

        </p>

        <a class="home-button" href="./">

        </a>
    </section>
</main>
```

</body>
</html>
